# bump-my-version: `bump patch|minor|major` when the pinned tinyuz release changes,
# `bump revision` for packaging-only changes (1.1.1 -> 1.1.1~1 in idf_component.yml).
# git refs can't contain "~", so the tag spells a revision as "-r1" (v1.1.1-r1).
[tool.bumpversion]
current_version = "1.1.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(-r(?P<revision>\\d+))?"
serialize = ["{major}.{minor}.{patch}-r{revision}", "{major}.{minor}.{patch}"]
commit = true
tag = true
tag_name = "v{new_version}"

# ESP Component Registry spelling of a revision: "~N".
[[tool.bumpversion.files]]
filename = "idf_component.yml"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(~(?P<revision>\\d+))?"
serialize = ["{major}.{minor}.{patch}~{revision}", "{major}.{minor}.{patch}"]
search = "version: \"{current_version}\""
replace = "version: \"{new_version}\""

[[tool.bumpversion.files]]
filename = "README.md"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(~(?P<revision>\\d+))?"
serialize = ["{major}.{minor}.{patch}~{revision}", "{major}.{minor}.{patch}"]
search = "brianpugh/esp_tinyuz^{current_version}"
replace = "brianpugh/esp_tinyuz^{new_version}"
